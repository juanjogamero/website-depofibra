name: Publicar web de Depofibra (demo o producción)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v6

      - name: Instalar y compilar Astro
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # Sin variable configurada permanece la demo; SOLO el propietario
          # activa producción creando la variable del repositorio en GitHub.
          DEPOFIBRA_SITE_URL: ${{ vars.DEPOFIBRA_SITE_URL || 'https://demo.depofibra.com' }}

      - name: Comprobar modelos AR de verticales y dimensiones métricas
        run: python3 scripts/check-ar-models.py

      - name: Comprobar geometrías de depósitos tipo vaso en metros
        run: python3 scripts/check-vaso-models.py

      - name: Comprobar traspaso de navegador desde Google App
        run: node --test scripts/test-google-handoff.mjs

      - name: Comprobar enlaces y sitemap antes de publicar
        run: npm run check:links

      - name: Comprobar contrato de captación sin envíos reales
        run: node --test scripts/test-commercial-funnel.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
