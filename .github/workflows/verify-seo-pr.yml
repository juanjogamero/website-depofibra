name: Verificar SEO sin publicar

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compilar Astro sin publicar
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del PR
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar compilación
        run: npm run build
        env:
          DEPOFIBRA_SITE_URL: https://depofibra.com
      - name: Verificar mallas 3D, escala en metros y 17 pares GLB/USDZ
        run: python3 scripts/check-ar-models.py
      - name: Comprobar los 8 depósitos tipo vaso en GLB y USDZ
        run: python3 scripts/check-vaso-models.py
      - name: Comprobar apertura externa desde Google App y preservación de selección
        run: node --test scripts/test-google-handoff.mjs
      - name: Verificar enlaces, anclas y sitemap internos
        run: npm run check:links
      - name: Verificar contrato de contacto y eventos sin enviar formularios
        run: node --test scripts/test-commercial-funnel.mjs
