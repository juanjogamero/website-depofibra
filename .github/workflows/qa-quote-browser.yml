name: QA navegador de solicitudes de presupuesto (sin envíos)

on:
  pull_request:
    paths:
      - 'src/components/QuoteModal.astro'
      - 'src/pages/solicitud-enviada/index.astro'
      - 'src/components/CookieConsent.astro'
      - 'scripts/test-commercial-funnel.mjs'
      - 'scripts/test-quote-browser.mjs'
      - '.github/workflows/qa-quote-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Simular fallo y aceptación FormSubmit en navegador
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Instalar sitio y navegador de pruebas temporal
        run: |
          npm ci
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Compilar sin publicar
        env:
          DEPOFIBRA_SITE_URL: https://depofibra.com
        run: npm run build
      - name: Probar formulario y privacidad con respuestas externas simuladas
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/depofibra-astro-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4321/contacto/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-quote-browser.mjs
